<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Commissioner</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme:dark;
    --bg:#08080B; --card:#1A1A24; --card-line:#343446; --seam:#3B3B52;
    --gold:#F0B54B; --cream:#FFF3DC; --txt:#D9D9E4; --txt-dim:#8D8D9F;
    --green:#5FC97A; --red:#E0574A;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; background:var(--bg); color:var(--txt); font-family:'Archivo',sans-serif; overscroll-behavior:none;}
  .app{height:100vh; max-width:480px; margin:0 auto; display:flex; flex-direction:column; background:var(--bg);}

  .header{flex:0 0 auto; border-bottom:1px solid var(--card-line);}
  .season{font-size:9.5px; letter-spacing:2.6px; font-weight:700; color:var(--txt-dim); text-align:center; padding:11px 16px 0;}
  .hbar{text-align:center; padding:10px 16px 12px;}
  .rd{font-size:27px; font-weight:800; letter-spacing:-.7px; color:var(--cream); line-height:1;}
  .whoami{font-family:'IBM Plex Mono'; font-size:13px; font-weight:600; letter-spacing:1.2px; color:var(--gold);}

  .tools{flex:0 0 auto; padding:0 16px 11px; border-bottom:1px solid var(--card-line);}
  .searchwrap{position:relative;}
  .search{width:100%; background:var(--card); border:1px solid var(--card-line); border-radius:10px;
          padding:11px 38px 11px 12px; color:var(--cream); font-size:16px; font-family:'Archivo';}
  .search:focus{outline:none; border-color:var(--gold);}
  .clearq{position:absolute; right:7px; top:50%; transform:translateY(-50%); width:24px; height:24px;
          border-radius:50%; background:var(--bg); border:1px solid var(--card-line); color:var(--txt-dim);
          display:none; align-items:center; justify-content:center; cursor:pointer; font-size:12px;}
  .clearq.show{display:flex;}
  .chips{display:flex; gap:6px; margin-top:9px; overflow-x:auto; scrollbar-width:none;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{flex:0 0 auto; font-family:'IBM Plex Mono'; font-size:9.5px; font-weight:700; letter-spacing:.8px;
        padding:6px 11px; border-radius:20px; background:var(--card); border:1px solid var(--card-line);
        color:var(--txt-dim); cursor:pointer; white-space:nowrap;}
  .chip.on{background:var(--gold); border-color:var(--gold); color:#17130A;}
  .chip b{font-weight:700;}

  .scroller{flex:1; min-height:0; overflow-y:auto; scrollbar-width:none;}
  .scroller::-webkit-scrollbar{display:none;}
  .list{padding:12px 16px 30px;}
  .empty{text-align:center; color:var(--txt-dim); font-size:12.5px; padding:34px 12px; font-style:italic;}

  .row{background:var(--card); border:1px solid var(--card-line); border-radius:11px; margin-bottom:8px;
       background-image:linear-gradient(180deg, rgba(255,255,255,.045) 0%, rgba(255,255,255,0) 50%);
       box-shadow:0 4px 12px -6px rgba(0,0,0,.8), inset 0 1px 0 rgba(255,255,255,.06); overflow:hidden;}
  .row.open{border-color:rgba(240,181,75,.5);}
  .top{display:flex; align-items:center; gap:11px; padding:11px 13px; cursor:pointer;}
  .sd{font-family:'IBM Plex Mono'; font-size:10px; font-weight:700; color:var(--txt-dim);
      width:34px; flex:0 0 auto; text-align:center; line-height:1.3;}
  .sd b{display:block; font-size:15px; color:var(--cream); line-height:1.1;}
  .mid{flex:1; min-width:0;}
  .nm{font-size:14.5px; font-weight:700; color:var(--cream); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .sub{font-family:'IBM Plex Mono'; font-size:9.5px; color:var(--txt-dim); margin-top:3px;}
  .state{font-family:'IBM Plex Mono'; font-size:10.5px; font-weight:700; flex:0 0 auto; text-align:right;}
  .state.paid{color:var(--green);}
  .state.zero{color:var(--red);}
  .state.due{color:#17130A; background:var(--gold); border-radius:20px; padding:4px 9px;}
  .state.wait{color:var(--txt-dim);}

  /* ---------- editor ---------- */
  .edit{display:none; padding:2px 13px 14px; border-top:1px solid var(--card-line); margin-top:2px;}
  .row.open .edit{display:block;}
  .lab{font-size:9.5px; letter-spacing:1.1px; color:var(--txt-dim); font-weight:700; margin:12px 0 5px;}
  .in{width:100%; background:var(--bg); border:1px solid var(--card-line); border-radius:9px;
      padding:10px 11px; color:var(--cream); font-size:16px; font-family:'Archivo';}
  .in.mono{font-family:'IBM Plex Mono';}
  .in:focus{outline:none; border-color:var(--gold);}
  .in:disabled{opacity:.4;}
  .money{display:flex; align-items:stretch;}
  .money span{background:var(--bg); border:1px solid var(--card-line); border-right:none;
              border-radius:9px 0 0 9px; padding:10px 11px; font-family:'IBM Plex Mono'; color:var(--txt-dim);}
  .money .in{border-radius:0 9px 9px 0;}
  .reasons{display:flex; gap:6px; flex-wrap:wrap;}
  .rz{font-family:'IBM Plex Mono'; font-size:9.5px; font-weight:700; padding:7px 10px; border-radius:20px;
      background:var(--bg); border:1px solid var(--card-line); color:var(--txt-dim); cursor:pointer;}
  .rz.on{background:rgba(224,87,74,.16); border-color:rgba(224,87,74,.55); color:var(--red);}
  .rz.none.on{background:rgba(95,201,122,.14); border-color:rgba(95,201,122,.5); color:var(--green);}
  .save{width:100%; margin-top:15px; background:var(--gold); color:#17130A; border:none; padding:12px;
        border-radius:10px; font-weight:800; font-size:14px; cursor:pointer; font-family:'Archivo';}
  .toast{position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(20px); opacity:0;
         background:var(--green); color:#0C1A10; font-weight:800; font-size:13px; padding:10px 18px;
         border-radius:22px; transition:.25s; pointer-events:none; z-index:80;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="season">2026 BOX OFFICE TOURNAMENT</div>
    <div class="hbar">
      <div class="rd">Commissioner Page</div>
    </div>
  </div>

  <div class="tools">
    <div class="searchwrap">
      <input class="search" id="q" placeholder="Search a film…" oninput="render()">
      <div class="clearq" id="clearq" onclick="clearSearch()">✕</div>
    </div>
    <div class="chips" id="chips"></div>
  </div>

  <div class="scroller"><div class="list" id="list"></div></div>
</div>
<div class="toast" id="toast">Saved</div>

<script>
/* ================= DATA ================= */
const seedOrder=[1,16,8,9,5,12,4,13,6,11,3,14,7,10,2,15];
const TITLES=[
 ["Avengers: Doomsday","Mercy","The Angry Birds Movie 3","Goat","Dr. Seuss' The Cat in the Hat","Young Washington","Michael","Focker-In-Law","Street Fighter","Practical Magic 2","Hexed","Cut Off","Scream 7","Return to Silent Hill","The Super Mario Galaxy Movie","Soulm8te"],
 ["Toy Story 5","Crime 101","PAW Patrol: The Dino Movie","Untitled Spielberg Film","Animal Friends","The Dog Stars","Forgotten Island","The Breadwinner","The Odyssey","Werwulf","Moana","Remain","Insidious 6","Evil Dead Burn","Dune: Part Three","Shiver"],
 ["The Mandalorian & Grogu","Reminders of Him","The Devil Wears Prada 2","The Bride!","Project Hail Mary","The Social Reckoning","Hoppers","Archangel","Mortal Kombat II","28 Years Later: The Bone Temple","Masters of the Universe","Cliffhanger","Violent Night 2","Wuthering Heights","The Hunger Games: Sunrise on the Reaping","The Drama"],
 ["Spider-Man: Brand New Day","Power Ballad","Clayface","Ready or Not 2: Here I Come","The Mummy","Whitney Springs","The Legend of Aang: The Last Airbender","4 Kids Walk Into a Bank","Narnia: The Magician's Nephew","Scary Movie 6","Jumanji 4","Greenland 2: Migration","Coyote vs Acme","Resident Evil","Supergirl: Woman of Tomorrow","The Sheep Detectives"]];

let _s=20260812;
const rnd=()=>{ _s|=0; _s=_s+0x6D2B79F5|0; let t=Math.imul(_s^_s>>>15,1|_s); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; };
const TODAY=new Date(2026,7,12);
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

/* Every pick in every bracket points at `id`. The title is only a label hung on
   it, so renaming a film can never disturb anyone's picks. */
let n=0;
const movies=[];
TITLES.forEach((list,b)=>list.forEach((name,i)=>{
  const m={id:'m'+(n++), name, seed:seedOrder[i], bracket:b+1};
  m.date=new Date(2026,0,4+Math.floor(rnd()*355));
  m.projected=Math.round(Math.max(1.1,175*Math.exp(-0.17*(m.seed-1))*(0.55+rnd()*0.95))*100)/100;
  m.score=null; m.zero=null;
  movies.push(m);
}));
// a plausible mid-season: most films that have opened already have their number
movies.forEach(m=>{ if(m.date<=TODAY && rnd()>0.12) m.score=m.projected; });
movies[7].zero='cancelled'; movies[7].score=0;
movies[29].zero='streaming'; movies[29].score=0;

const iso = d => d.toISOString().slice(0,10);
const short = d => `${MONTHS[d.getMonth()]} ${d.getDate()}`;
const needsScore = m => !m.zero && m.score==null && m.date<=TODAY;

/* ================= UI ================= */
let sortBy='release', openId=null;
const SORTS=[['release','RELEASE'],['seed','RANK'],['name','A–Z'],['score','SCORE']];

function passes(m){
  const q=document.getElementById('q').value.trim().toLowerCase();
  return !q || m.name.toLowerCase().includes(q);
}
function ordered(list){
  const by={
    release:(a,b)=> a.date-b.date,
    seed:   (a,b)=> a.seed-b.seed || a.bracket-b.bracket,
    name:   (a,b)=> a.name.localeCompare(b.name),
    // biggest opening first; anything without a number yet falls to the bottom
    score:  (a,b)=> (b.score??-1)-(a.score??-1) || a.date-b.date,
  }[sortBy];
  return [...list].sort(by);
}

function stateHTML(m){
  if(m.zero) return `<div class="state zero">$0.00M<br>${m.zero}</div>`;
  if(m.score!=null) return `<div class="state paid">$${m.score.toFixed(2)}M</div>`;
  if(needsScore(m)) return `<div class="state due">NEEDS SCORE</div>`;
  return `<div class="state wait">${short(m.date)}</div>`;
}

function render(){
  const rows=ordered(movies.filter(passes));
  document.getElementById('clearq').classList.toggle('show', document.getElementById('q').value!=='');

  document.getElementById('chips').innerHTML=SORTS.map(([k,l])=>
    `<div class="chip ${sortBy===k?'on':''}" onclick="setSort('${k}')">${l}</div>`).join('');

  document.getElementById('list').innerHTML = rows.length ? rows.map(m=>`
    <div class="row ${openId===m.id?'open':''}">
      <div class="top" onclick="toggle('${m.id}')">
        <div class="sd"><b>${m.seed}</b>B${m.bracket}</div>
        <div class="mid"><div class="nm">${m.name}</div><div class="sub">opens ${short(m.date)}</div></div>
        ${stateHTML(m)}
      </div>
      <div class="edit">
        <div class="lab">FILM TITLE</div>
        <input class="in" id="n-${m.id}" value="${m.name.replace(/"/g,'&quot;')}">
        <div class="lab">RELEASE DATE</div>
        <input class="in mono" type="date" id="d-${m.id}" value="${iso(m.date)}" ${m.zero?'disabled':''}>
        <div class="lab">OPENING WEEKEND</div>
        <div class="money"><span>$</span>
          <input class="in mono" type="number" step="0.01" placeholder="0.00" id="s-${m.id}"
                 value="${m.score!=null&&!m.zero?m.score.toFixed(2):''}" ${m.zero?'disabled':''}></div>
        <div class="lab">NEVER OPENED IN THEATRES</div>
        <div class="reasons">
          ${[['','In theatres'],['streaming','Streaming'],['cancelled','Cancelled'],['pushed to 2027','Pushed to 2027']]
            .map(([v,l])=>`<div class="rz ${v===''?'none':''} ${(m.zero||'')===v?'on':''}"
                 onclick="setZero('${m.id}','${v}')">${l}</div>`).join('')}
        </div>
        <button class="save" onclick="save('${m.id}')">Save</button>
      </div>
    </div>`).join('') : `<div class="empty">Nothing here right now.</div>`;
}

function setSort(k){ sortBy=k; openId=null; render(); }
function clearSearch(){ const q=document.getElementById('q'); q.value=''; q.focus(); render(); }
function toggle(id){ openId = openId===id ? null : id; render(); }

function setZero(id,v){
  const m=movies.find(x=>x.id===id);
  m.zero = v || null;
  if(m.zero) m.score=0;
  else if(m.score===0) m.score=null;
  render();
}

function save(id){
  const m=movies.find(x=>x.id===id);
  const name=document.getElementById('n-'+id).value.trim();
  const date=document.getElementById('d-'+id).value;
  const sc=document.getElementById('s-'+id).value;
  if(name) m.name=name;
  if(date && !m.zero){ const [y,mo,d]=date.split('-').map(Number); m.date=new Date(y,mo-1,d); }
  if(!m.zero) m.score = sc==='' ? null : Math.round(parseFloat(sc)*100)/100;
  openId=null; render();
  const t=document.getElementById('toast');
  t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1400);
}

render();
</script>
</body>
</html>
