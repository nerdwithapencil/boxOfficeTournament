name: Keep Supabase awake

# Supabase pauses free-tier projects after 7 days with no activity. This runs
# once a day and writes to a dedicated keepalive table — a write, not a read,
# since a warning email arrived on 2026-08-28 despite the read-based version
# of this workflow having run successfully every day since setup. Whatever
# Supabase's inactivity check actually measures, a genuine row update leaves
# no room for doubt. See BUILD-SPEC.md section 11.
#
# Needs a repo secret named SUPABASE_SERVICE_ROLE_KEY (Settings > Secrets and
# variables > Actions) — the keepalive table has RLS enabled with no policies
# at all, so only the service_role key (which bypasses RLS) can write to it.
on:
  schedule:
    - cron: '23 11 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Write to Supabase
        run: |
          curl -sf -o /dev/null \
            -X PATCH \
            "https://jqcdjkncdfppmdkndafl.supabase.co/rest/v1/keepalive?id=eq.1" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"pinged_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}"
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
